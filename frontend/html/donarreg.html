
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1f2, #ffe4e6);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 520px;
            max-width: 100%;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(190, 24, 60, 0.15);
            border-top: 6px solid #dc2626;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .blood-icon {
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 0;
            color: #991b1b;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .location-title {
            margin-top: 25px;
            margin-bottom: 15px;
            color: #991b1b;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #fecaca;
            padding-bottom: 8px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 25px;
            padding: 15px;
            background: #fff1f2;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            margin-top: 1px;
            accent-color: #dc2626;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            color: #4b5563;
            line-height: 1.5;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.25);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="blood-icon">🩸</div>

            <h1>Donor Registration</h1>

            <p class="subtitle">
                Become a donor and help save lives
            </p>
        </div>

        <form id="donorForm">

            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Blood Group -->
            <div class="form-group">
                <label for="bloodGroup">Blood Group</label>

                <select
                    id="bloodGroup"
                    name="bloodGroup"
                    required
                >
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>

                <input
                    type="date"
                    id="dateOfBirth"
                    name="dateOfBirth"
                    required
                >
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender</label>

                <select
                    id="gender"
                    name="gender"
                    required
                >
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Phone -->
                    <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    minlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    required
                >
            </div>

            <!-- Location -->
            <div class="location-title">
                📍 Location
            </div>

            <!-- State -->
            <div class="form-group">
                <label for="state">State</label>

                <input
                    type="text"
                    id="state"
                    name="state"
                    placeholder="Example: Tamil Nadu"
                    required
                >
            </div>

            <!-- City -->
            <div class="form-group">
                <label for="city">City</label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Example: Chennai"
                    required
                >
            </div>

            <!-- Area -->
            <div class="form-group">
                <label for="area">Area</label>

                <input
                    type="text"
                    id="area"
                    name="area"
                    placeholder="Example: Avadi"
                    required
                >
            </div>

            <!-- Consent -->
            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="consent"
                    name="consent"
                    required
                >

                <label for="consent">
                    I agree to be contacted for blood donation
                    and allow my donor information to be used
                    for finding blood donors.
                </label>

            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="submit-btn"
            >
                🩸 Register as Donor
            </button>

        </form>

    </div>

    <script src="../JS/donar.js"></script>

</body>

</html>
